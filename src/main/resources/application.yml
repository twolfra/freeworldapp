spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketplace}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update   # dev only; switch to Flyway for production
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
  # Mail: set MAIL_HOST env var to enable SMTP. Without it, verification links are logged to console.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
server:
  port: ${PORT:8080}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
app:
  admin:
    emails: ${ADMIN_EMAILS:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:noreply@freeworldapp.local}
  base-url: ${BASE_URL:http://localhost:5173}
