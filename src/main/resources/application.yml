spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketplace}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    # Existing databases (created by the old ddl-auto:update) already contain the
    # baseline schema — mark V1 as applied there instead of running it.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate   # schema is managed exclusively by Flyway migrations
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
  # Mail: set MAIL_HOST env var to enable SMTP. Without it, verification links are logged to console.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
# API docs (Swagger UI at /api/docs). Enabled by default for dev;
# set SPRINGDOC_ENABLED=false in production to hide them.
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /api/docs/spec
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /api/docs
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
server:
  port: ${PORT:8080}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
app:
  security:
    # true → Content-Security-Policy-Report-Only (trial mode); false → enforce
    csp-report-only: ${CSP_REPORT_ONLY:false}
  admin:
    emails: ${ADMIN_EMAILS:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:noreply@freeworldapp.local}
  base-url: ${BASE_URL:http://localhost:5173}
